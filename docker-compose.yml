services:
  docseek:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8010:8010"
    environment:
      # one LLM is required: LLM_PROVIDER (+ LLM_MODEL / LLM_API_KEY / LLM_BASE_URL), or just ANTHROPIC_API_KEY
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
      # set it to require an X-API-Key header on every request; unset, the API is open
      CRAWLER_API_KEY: ${CRAWLER_API_KEY:-}
      # route the crawl's traffic to sites through a proxy (model calls stay direct)
      PROXY_SERVER: ${PROXY_SERVER:-}
      PROXY_USERNAME: ${PROXY_USERNAME:-}
      PROXY_PASSWORD: ${PROXY_PASSWORD:-}
      # crawl with a remote browser instead of the local Chromium (wss://..., any CDP provider)
      BROWSER_CDP_URL: ${BROWSER_CDP_URL:-}
      PATTERNS_DIR: /app/data/patterns
      # PROGRAMS_DIR: /app/data/programs   # generated discovery programs: off unless set (see README)
      # CODEGEN_MODEL: claude-sonnet-5
    volumes:
      - ./data/patterns:/app/data/patterns
