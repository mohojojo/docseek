name: Feature request
description: Something docseek should do that it does not.
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What you are trying to do
      description: The goal and the kind of site, rather than the solution you have in mind.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How you imagine it
